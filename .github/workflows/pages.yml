name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushes the built site to the gh-pages branch (no "GitHub Actions" Pages source required).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p public
          cp index.html public/
          cp -r assets public/
          touch public/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
